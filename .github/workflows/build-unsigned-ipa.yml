name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project CodexMobile/CodexMobile.xcodeproj \
            -scheme CodexMobile \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-resolve.log"

      - name: Archive without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project CodexMobile/CodexMobile.xcodeproj \
            -scheme CodexMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PathwitCode.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/PathwitCode.xcarchive/Products/Applications/CodexMobile.app"
          IPA_ROOT="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/PathwitCode-unsigned.ipa"

          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT" "$IPA_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/Pathwit Code.app"

          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$IPA_PATH" Payload

          mkdir -p "$GITHUB_WORKSPACE/build"
          cp "$IPA_PATH" "$GITHUB_WORKSPACE/build/PathwitCode-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: PathwitCode-unsigned-ipa
          path: build/PathwitCode-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild-resolve.log
            ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore
